name: Build Snapp License Client APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Studio Project Files
        shell: bash
        run: |
          mkdir -p app/src/main/java/ir/hyperlink/snapp/client
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SnappLicenseClient"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.hyperlink.snapp.client'
              compileSdk 34

              defaultConfig {
                  applicationId "ir.hyperlink.snapp.client"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      applicationIdSuffix ""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#22C55E"
                  android:pathData="M54,20A34,34 0 1,0 88,54A34,34 0 0,0 54,20ZM48,70L32,54l5.6,-5.6L48,58.8l22.4,-22.4L76,42Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Snapp License</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|uiMode|density"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/ir/hyperlink/snapp/client/MainActivity.java
          package ir.hyperlink.snapp.client;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.http.SslError;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.text.TextUtils;
          import android.util.Base64;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.ConsoleMessage;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {

              private static final String SNAPP_START_URL = "https://app.snapp.taxi/?superapp_service=menu";
              private static final String API_BASE_PRIMARY = "https://testtok-production2.up.railway.app/api/snapp/get-license/";
              private static final String API_BASE_FALLBACK = "https://testtok-production2.up.railway.app/api/tapsi/get-license/";

              private static final String COLOR_BG_BAR = "#0F172A";
              private static final String COLOR_BG_CARD = "#1E293B";
              private static final String COLOR_BORDER = "#334155";
              private static final String COLOR_ACCENT = "#22C55E";
              private static final String COLOR_SUCCESS = "#10B981";
              private static final String COLOR_WARNING = "#F59E0B";
              private static final String COLOR_ERROR = "#F87171";
              private static final String COLOR_TEXT_MAIN = "#F8FAFC";
              private static final String COLOR_TEXT_MUTED = "#94A3B8";

              private static final String COMPAT_AND_DIAG_JS =
                      "(function(){" +
                      "if(window.__snappCompatApplied)return;" +
                      "window.__snappCompatApplied=true;" +
                      "try{" +
                      "if(!Object.hasOwn){Object.hasOwn=function(o,p){return Object.prototype.hasOwnProperty.call(o,p);};}" +
                      "if(!Array.prototype.at){Array.prototype.at=function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;if(n<0||n>=this.length)return undefined;return this[n];};}" +
                      "if(!String.prototype.at){String.prototype.at=function(n){n=Math.trunc(n)||0;if(n<0)n+=this.length;if(n<0||n>=this.length)return undefined;return this.charAt(n);};}" +
                      "if(!String.prototype.replaceAll){String.prototype.replaceAll=function(s,r){if(s instanceof RegExp){if(!s.global)throw new TypeError('non-global RegExp');return this.replace(s,r);}return this.split(String(s)).join(String(r));};}" +
                      "if(!Array.prototype.findLast){Array.prototype.findLast=function(cb,t){for(var i=this.length-1;i>=0;i--){if(cb.call(t,this[i],i,this))return this[i];}return undefined;};}" +
                      "if(!Array.prototype.findLastIndex){Array.prototype.findLastIndex=function(cb,t){for(var i=this.length-1;i>=0;i--){if(cb.call(t,this[i],i,this))return i;}return -1;};}" +
                      "if(!Array.prototype.toSorted){Array.prototype.toSorted=function(fn){return this.slice().sort(fn);};}" +
                      "if(!Array.prototype.toReversed){Array.prototype.toReversed=function(){return this.slice().reverse();};}" +
                      "if(typeof window.structuredClone!=='function'){window.structuredClone=function(v){return JSON.parse(JSON.stringify(v));};}" +
                      "if(window.crypto&&!window.crypto.randomUUID){window.crypto.randomUUID=function(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;var v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});};}" +
                      "if(window.AbortSignal&&!window.AbortSignal.timeout&&window.AbortController){window.AbortSignal.timeout=function(ms){var c=new AbortController();setTimeout(function(){c.abort();},ms);return c.signal;};}" +
                      "window.addEventListener('error',function(e){if(window.__snappClientDiag){window.__snappClientDiag.log('ERR: '+(e&&e.message?e.message:'unknown'));}});" +
                      "window.addEventListener('unhandledrejection',function(e){if(window.__snappClientDiag){var r=e&&e.reason?(e.reason.message||String(e.reason)):'unknown';window.__snappClientDiag.log('PROMISE: '+r);}});" +
                      "var _of=window.fetch;" +
                      "if(_of){window.fetch=function(){var u='';try{u=(typeof arguments[0]==='string')?arguments[0]:(arguments[0]&&arguments[0].url?arguments[0].url:'');}catch(e){}return _of.apply(this,arguments).then(function(res){try{if(!res.ok&&window.__snappClientDiag){window.__snappClientDiag.log('FETCH '+res.status+' '+u);}}catch(e){}return res;},function(err){try{if(window.__snappClientDiag){window.__snappClientDiag.log('FETCH_FAIL '+(err&&err.message?err.message:err)+' '+u);}}catch(e){}throw err;});};}" +
                      "}catch(e){}" +
                      "})();";

              private FrameLayout centerContainer;
              private WebView webView;
              private ProgressBar progressBar;
              private TextView statusBadge;
              private EditText licenseInput;
              private Button loginBtn;
              private Button pasteBtn;
              private Button logoutBtn;

              private String pendingLocalStorageJson = null;
              private String pendingPhoneLabel = null;

              private final List<String> diagLogs = new ArrayList<>();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      getWindow().setStatusBarColor(Color.parseColor(COLOR_BG_BAR));
                      getWindow().setNavigationBarColor(Color.parseColor(COLOR_BG_BAR));
                  }

                  requestLocationPermissionsIfNeeded();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  topBar.setPadding(dp(12), dp(8), dp(12), dp(8));

                  TextView brandTitle = new TextView(this);
                  brandTitle.setText("🔑 Snapp Loader");
                  brandTitle.setTextColor(Color.parseColor(COLOR_ACCENT));
                  brandTitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  brandTitle.setTypeface(Typeface.DEFAULT_BOLD);

                  statusBadge = new TextView(this);
                  statusBadge.setText("آماده ورود با لایسنس");
                  statusBadge.setTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  statusBadge.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  statusBadge.setSingleLine(true);
                  statusBadge.setEllipsize(TextUtils.TruncateAt.END);
                  GradientDrawable badgeBg = new GradientDrawable();
                  badgeBg.setColor(Color.parseColor(COLOR_BG_CARD));
                  badgeBg.setCornerRadius(dp(12));
                  statusBadge.setBackground(badgeBg);
                  statusBadge.setPadding(dp(10), dp(4), dp(10), dp(4));
                  LinearLayout.LayoutParams badgeParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  badgeParams.setMargins(dp(10), 0, dp(10), 0);
                  statusBadge.setLayoutParams(badgeParams);
                  statusBadge.setOnClickListener(v -> showDiagDialog());

                  Button reloadBtn = createHeaderButton("🔄 رفرش");
                  reloadBtn.setOnClickListener(v -> {
                      if (webView != null) webView.reload();
                  });

                  Button homeBtn = createHeaderButton("🏠 منو اسنپ");
                  LinearLayout.LayoutParams homeParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  homeParams.setMargins(dp(6), 0, 0, 0);
                  homeBtn.setLayoutParams(homeParams);
                  homeBtn.setOnClickListener(v -> {
                      if (webView != null) webView.loadUrl(SNAPP_START_URL);
                  });

                  topBar.addView(brandTitle);
                  topBar.addView(statusBadge);
                  topBar.addView(reloadBtn);
                  topBar.addView(homeBtn);
                  root.addView(topBar);

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(2)));
                  root.addView(progressBar);

                  centerContainer = new FrameLayout(this);
                  LinearLayout.LayoutParams centerParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f);
                  centerContainer.setLayoutParams(centerParams);

                  webView = new WebView(this);
                  webView.setLayoutParams(new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setupWebView();
                  centerContainer.addView(webView);
                  root.addView(centerContainer);

                  View divider = new View(this);
                  divider.setBackgroundColor(Color.parseColor("#1E293B"));
                  divider.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(1)));
                  root.addView(divider);

                  LinearLayout bottomPanel = new LinearLayout(this);
                  bottomPanel.setOrientation(LinearLayout.VERTICAL);
                  bottomPanel.setBackgroundColor(Color.parseColor(COLOR_BG_BAR));
                  bottomPanel.setPadding(dp(10), dp(8), dp(10), dp(10));

                  LinearLayout inputRow = new LinearLayout(this);
                  inputRow.setOrientation(LinearLayout.HORIZONTAL);
                  inputRow.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams inputRowParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  inputRowParams.setMargins(0, 0, 0, dp(8));
                  inputRow.setLayoutParams(inputRowParams);

                  licenseInput = new EditText(this);
                  licenseInput.setHint("کلید لایسنس (مثلاً Snapp-XXXX-XXXX)");
                  licenseInput.setHintTextColor(Color.parseColor(COLOR_TEXT_MUTED));
                  licenseInput.setTextColor(Color.parseColor(COLOR_TEXT_MAIN));
                  licenseInput.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  licenseInput.setSingleLine(true);
                  licenseInput.setTypeface(Typeface.MONOSPACE, Typeface.NORMAL);
                  licenseInput.setGravity(Gravity.CENTER_VERTICAL | Gravity.LEFT);
                  GradientDrawable inputBg = new GradientDrawable();
                  inputBg.setColor(Color.parseColor(COLOR_BG_CARD));
                  inputBg.setCornerRadius(dp(10));
                  inputBg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  licenseInput.setBackground(inputBg);
                  licenseInput.setPadding(dp(12), dp(8), dp(12), dp(8));
                  LinearLayout.LayoutParams editParams = new LinearLayout.LayoutParams(
                          0, dp(42), 1f);
                  editParams.setMargins(0, 0, dp(6), 0);
                  licenseInput.setLayoutParams(editParams);

                  pasteBtn = createActionButton("📋 جایگذاری", COLOR_BG_CARD, COLOR_TEXT_MAIN, COLOR_BORDER);
                  LinearLayout.LayoutParams pasteParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, dp(42));
                  pasteBtn.setLayoutParams(pasteParams);
                  pasteBtn.setPadding(dp(12), 0, dp(12), 0);
                  pasteBtn.setOnClickListener(v -> pasteLicenseFromClipboard());

                  inputRow.addView(licenseInput);
                  inputRow.addView(pasteBtn);
                  bottomPanel.addView(inputRow);

                  LinearLayout actionRow = new LinearLayout(this);
                  actionRow.setOrientation(LinearLayout.HORIZONTAL);
                  actionRow.setGravity(Gravity.CENTER_VERTICAL);

                  loginBtn = createActionButton("🚀 ورود با لایسنس", COLOR_ACCENT, "#052E16", null);
                  LinearLayout.LayoutParams loginParams = new LinearLayout.LayoutParams(
                          0, dp(44), 1.35f);
                  loginParams.setMargins(0, 0, dp(5), 0);
                  loginBtn.setLayoutParams(loginParams);
                  loginBtn.setOnClickListener(v -> startLicenseLogin());

                  logoutBtn = createActionButton("🧹 خروج / لایسنس بعدی", "#271A0C", COLOR_WARNING, COLOR_WARNING);
                  LinearLayout.LayoutParams logoutParams = new LinearLayout.LayoutParams(
                          0, dp(44), 0.85f);
                  logoutParams.setMargins(dp(5), 0, 0, 0);
                  logoutBtn.setLayoutParams(logoutParams);
                  logoutBtn.setOnClickListener(v -> resetAndClearSession());

                  actionRow.addView(loginBtn);
                  actionRow.addView(logoutBtn);
                  bottomPanel.addView(actionRow);

                  root.addView(bottomPanel);

                  setContentView(root);
                  webView.loadUrl(SNAPP_START_URL);
              }

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              private void setupWebView() {
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  disableForceDark(settings);

                  String defaultUa = settings.getUserAgentString();
                  if (defaultUa != null) {
                      String cleanUa = defaultUa
                              .replace("; wv", "")
                              .replaceAll("Version/\\d+\\.\\d+\\s*", "")
                              .replaceAll("\\s*Build/[^;)]+", "");
                      settings.setUserAgentString(cleanUa);
                  }

                  webView.addJavascriptInterface(new DiagBridge(), "__snappClientDiag");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      cookieManager.setAcceptThirdPartyCookies(webView, true);
                  }

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, true);
                      }

                      @Override
                      public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                          if (consoleMessage != null && consoleMessage.messageLevel() == ConsoleMessage.MessageLevel.ERROR) {
                              addDiagLog("CONSOLE: " + consoleMessage.message());
                          }
                          return super.onConsoleMessage(consoleMessage);
                      }

                      @SuppressLint("SetJavaScriptEnabled")
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView tempWebView = new WebView(MainActivity.this);
                          tempWebView.getSettings().setJavaScriptEnabled(true);
                          tempWebView.getSettings().setDomStorageEnabled(true);
                          tempWebView.getSettings().setUserAgentString(webView.getSettings().getUserAgentString());
                          tempWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  webView.loadUrl(request.getUrl().toString());
                                  v.destroy();
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  if (url != null && !url.equals("about:blank")) {
                                      webView.loadUrl(url);
                                      v.destroy();
                                  }
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(tempWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          view.evaluateJavascript(COMPAT_AND_DIAG_JS, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(COMPAT_AND_DIAG_JS, null);
                          CookieManager.getInstance().flush();

                          if (pendingLocalStorageJson != null && url != null && url.contains("snapp.taxi")) {
                              final String jsonToInject = pendingLocalStorageJson;
                              pendingLocalStorageJson = null;
                              injectLocalStorageIntoWebView(jsonToInject);
                          }
                      }

                      @Override
                      public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                          super.onReceivedHttpError(view, request, errorResponse);
                          if (request != null && errorResponse != null) {
                              addDiagLog("HTTP " + errorResponse.getStatusCode() + " -> " + request.getUrl());
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request != null && error != null) {
                              addDiagLog("NET " + error.getErrorCode() + " (" + error.getDescription() + ") -> " + request.getUrl());
                          }
                      }

                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          String url = error != null ? error.getUrl() : "";
                          addDiagLog("SSL " + (error != null ? error.getPrimaryError() : -1) + " -> " + url);
                          if (url != null && (url.contains("snapp.taxi") || url.contains("snapp.ir") || url.contains("snappmaps.ir"))) {
                              handler.proceed();
                          } else {
                              handler.cancel();
                          }
                      }

                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          addDiagLog("RENDER_GONE crash=" + (detail != null && detail.didCrash()));
                          if (webView != null && centerContainer != null) {
                              centerContainer.removeView(webView);
                              webView.destroy();
                              webView = new WebView(MainActivity.this);
                              webView.setLayoutParams(new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT));
                              setupWebView();
                              centerContainer.addView(webView);
                              webView.loadUrl(SNAPP_START_URL);
                          }
                          return true;
                      }
                  });
              }

              @SuppressWarnings("deprecation")
              private void disableForceDark(WebSettings settings) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      settings.setAlgorithmicDarkeningAllowed(false);
                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      settings.setForceDark(WebSettings.FORCE_DARK_OFF);
                  }
              }

              private class DiagBridge {
                  @JavascriptInterface
                  public void log(String message) {
                      addDiagLog("JS: " + message);
                  }
              }

              private void addDiagLog(String msg) {
                  synchronized (diagLogs) {
                      if (diagLogs.size() >= 60) {
                          diagLogs.remove(0);
                      }
                      diagLogs.add(msg);
                  }
              }

              private String getWebViewVersionInfo() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          PackageInfo pkg = WebView.getCurrentWebViewPackage();
                          if (pkg != null) {
                              return pkg.packageName + " (" + pkg.versionName + ")";
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return "Unknown";
              }

              private void showDiagDialog() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Device: ").append(Build.MANUFACTURER).append(" ").append(Build.MODEL).append("\n");
                  sb.append("Android: ").append(Build.VERSION.RELEASE).append(" (API ").append(Build.VERSION.SDK_INT).append(")\n");
                  sb.append("WebView: ").append(getWebViewVersionInfo()).append("\n");
                  sb.append("UA: ").append(webView != null ? webView.getSettings().getUserAgentString() : "").append("\n\n");
                  synchronized (diagLogs) {
                      if (diagLogs.isEmpty()) {
                          sb.append("لاگ خطایی ثبت نشده است.");
                      } else {
                          for (String item : diagLogs) {
                              sb.append("- ").append(item).append("\n");
                          }
                      }
                  }
                  final String fullReport = sb.toString();
                  new AlertDialog.Builder(this)
                          .setTitle("گزارش عیب‌یابی WebView")
                          .setMessage(fullReport)
                          .setPositiveButton("کپی گزارش", (d, w) -> {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              if (cm != null) {
                                  cm.setPrimaryClip(ClipData.newPlainText("snapp_diag", fullReport));
                                  Toast.makeText(this, "گزارش کپی شد", Toast.LENGTH_SHORT).show();
                              }
                          })
                          .setNegativeButton("بستن", null)
                          .show();
              }

              private void pasteLicenseFromClipboard() {
                  ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (clipboard != null && clipboard.hasPrimaryClip()) {
                      ClipData clip = clipboard.getPrimaryClip();
                      if (clip != null && clip.getItemCount() > 0 && clip.getItemAt(0).getText() != null) {
                          String text = clip.getItemAt(0).getText().toString().trim();
                          licenseInput.setText(text);
                          licenseInput.setSelection(text.length());
                          Toast.makeText(this, "📋 کلید لایسنس جایگذاری شد", Toast.LENGTH_SHORT).show();
                          return;
                      }
                  }
                  Toast.makeText(this, "⚠️ کلیپ‌بورد خالی است", Toast.LENGTH_SHORT).show();
              }

              private void startLicenseLogin() {
                  String key = licenseInput.getText() != null ? licenseInput.getText().toString().trim() : "";
                  if (key.isEmpty()) {
                      Toast.makeText(this, "⚠️ لطفاً ابتدا کلید لایسنس را وارد کنید", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  hideKeyboard();
                  updateStatusBadge("⏳ در حال دریافت اطلاعات لایسنس...", COLOR_WARNING);
                  loginBtn.setEnabled(false);
                  loginBtn.setText("⏳ در حال اتصال...");

                  fetchLicenseFromServer(key, true);
              }

              private void fetchLicenseFromServer(final String licenseKey, final boolean usePrimaryUrl) {
                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      try {
                          String encodedKey = URLEncoder.encode(licenseKey, "UTF-8");
                          String fullUrl = (usePrimaryUrl ? API_BASE_PRIMARY : API_BASE_FALLBACK) + encodedKey;
                          URL url = new URL(fullUrl);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("GET");
                          conn.setConnectTimeout(20000);
                          conn.setReadTimeout(20000);
                          conn.setRequestProperty("Accept", "application/json");

                          int code = conn.getResponseCode();
                          if (code == 404 && usePrimaryUrl) {
                              conn.disconnect();
                              fetchLicenseFromServer(licenseKey, false);
                              return;
                          }

                          InputStream is = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                          StringBuilder responseText = new StringBuilder();
                          if (is != null) {
                              try (BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                                  String line;
                                  while ((line = br.readLine()) != null) {
                                      responseText.append(line);
                                  }
                              }
                          }

                          JSONObject rootJson = new JSONObject(responseText.toString());
                          boolean isOk = (code >= 200 && code < 300) && rootJson.optBoolean("success", false);

                          if (isOk) {
                              JSONObject dataObj = rootJson.getJSONObject("data");
                              final String localStorageStr = dataObj.optString("local_storage", "{}");
                              final String phone = dataObj.optString("phone_number", "نامشخص");

                              mainHandler.post(() -> {
                                  pendingPhoneLabel = phone;
                                  applyFetchedSession(localStorageStr);
                              });
                          } else {
                              final String detail = rootJson.optString("detail", "لایسنس یافت نشد یا معتبر نیست");
                              mainHandler.post(() -> {
                                  loginBtn.setEnabled(true);
                                  loginBtn.setText("🚀 ورود با لایسنس");
                                  updateStatusBadge("❌ " + detail, COLOR_ERROR);
                                  Toast.makeText(MainActivity.this, "❌ " + detail, Toast.LENGTH_LONG).show();
                              });
                          }

                      } catch (Exception err) {
                          mainHandler.post(() -> {
                              loginBtn.setEnabled(true);
                              loginBtn.setText("🚀 ورود با لایسنس");
                              updateStatusBadge("❌ خطا در ارتباط با سرور", COLOR_ERROR);
                              Toast.makeText(MainActivity.this, "❌ خطا: " + err.getMessage(), Toast.LENGTH_LONG).show();
                          });
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  }).start();
              }

              private void applyFetchedSession(final String localStorageJson) {
                  String currentUrl = webView.getUrl() != null ? webView.getUrl() : "";
                  if (currentUrl.contains("snapp.taxi")) {
                      injectLocalStorageIntoWebView(localStorageJson);
                  } else {
                      pendingLocalStorageJson = localStorageJson;
                      webView.loadUrl(SNAPP_START_URL);
                  }
              }

              private void injectLocalStorageIntoWebView(final String localStorageJson) {
                  try {
                      String base64Payload = Base64.encodeToString(
                              localStorageJson.getBytes(StandardCharsets.UTF_8),
                              Base64.NO_WRAP
                      );

                      String js = "(function() {" +
                              "  try {" +
                              "    window.localStorage.clear();" +
                              "    window.sessionStorage.clear();" +
                              "    var raw = decodeURIComponent(escape(window.atob('" + base64Payload + "')));" +
                              "    var data = JSON.parse(raw);" +
                              "    var count = 0;" +
                              "    for (var k in data) {" +
                              "      if (Object.prototype.hasOwnProperty.call(data, k)) {" +
                              "        window.localStorage.setItem(k, data[k]);" +
                              "        count++;" +
                              "      }" +
                              "    }" +
                              "    return 'OK:' + count;" +
                              "  } catch (e) {" +
                              "    return 'ERR:' + e.message;" +
                              "  }" +
                              "})();";

                      webView.evaluateJavascript(js, result -> {
                          loginBtn.setEnabled(true);
                          loginBtn.setText("🚀 ورود با لایسنس");

                          if (result != null && result.contains("OK:")) {
                              String phoneTag = (pendingPhoneLabel != null && !pendingPhoneLabel.equals("unknown"))
                                      ? " (" + pendingPhoneLabel + ")"
                                      : "";
                              updateStatusBadge("✅ نشست فعال شد" + phoneTag, COLOR_SUCCESS);
                              Toast.makeText(MainActivity.this, "✅ لایسنس با موفقیت اعمال شد!", Toast.LENGTH_SHORT).show();
                              CookieManager.getInstance().flush();
                              webView.loadUrl(SNAPP_START_URL);
                          } else {
                              updateStatusBadge("❌ خطا در تزریق نشست", COLOR_ERROR);
                              Toast.makeText(MainActivity.this, "❌ خطا در اعمال LocalStorage: " + result, Toast.LENGTH_LONG).show();
                          }
                      });
                  } catch (Exception e) {
                      loginBtn.setEnabled(true);
                      loginBtn.setText("🚀 ورود با لایسنس");
                      updateStatusBadge("❌ خطای تزریق", COLOR_ERROR);
                  }
              }

              private void resetAndClearSession() {
                  updateStatusBadge("🧹 در حال پاک‌سازی نشست...", COLOR_WARNING);
                  pendingLocalStorageJson = null;
                  pendingPhoneLabel = null;
                  licenseInput.setText("");

                  try {
                      webView.evaluateJavascript(
                              "(function() { try { window.localStorage.clear(); window.sessionStorage.clear(); } catch(e) {} })();",
                              null
                      );

                      WebStorage.getInstance().deleteAllData();

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.removeAllCookies(value -> {
                          cookieManager.flush();
                          webView.clearCache(true);
                          webView.clearFormData();
                          webView.clearHistory();
                          webView.loadUrl(SNAPP_START_URL);

                          updateStatusBadge("آماده ورود با لایسنس جدید", COLOR_TEXT_MUTED);
                          Toast.makeText(this, "✅ نشست قبلی پاک شد؛ آماده لایسنس بعدی", Toast.LENGTH_SHORT).show();
                      });
                  } catch (Exception err) {
                      updateStatusBadge("❌ خطا در پاک‌سازی", COLOR_ERROR);
                  }
              }

              private void hideKeyboard() {
                  try {
                      View view = this.getCurrentFocus();
                      if (view != null) {
                          InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                          if (imm != null) {
                              imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void updateStatusBadge(String text, String colorHex) {
                  statusBadge.setText(text);
                  statusBadge.setTextColor(Color.parseColor(colorHex));
              }

              private Button createActionButton(String text, String bgHex, String textHex, String strokeHex) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(textHex));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  btn.setSingleLine(true);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(bgHex));
                  bg.setCornerRadius(dp(10));
                  if (strokeHex != null) {
                      bg.setStroke(dp(1), Color.parseColor(strokeHex));
                  }
                  btn.setBackground(bg);
                  btn.setPadding(dp(8), 0, dp(8), 0);
                  return btn;
              }

              private Button createHeaderButton(String text) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setAllCaps(false);
                  btn.setTextColor(Color.parseColor(COLOR_TEXT_MAIN));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor(COLOR_BG_CARD));
                  bg.setCornerRadius(dp(8));
                  bg.setStroke(dp(1), Color.parseColor(COLOR_BORDER));
                  btn.setBackground(bg);
                  btn.setPadding(dp(10), dp(4), dp(10), dp(4));
                  btn.setMinHeight(0);
                  btn.setMinimumHeight(0);
                  btn.setMinWidth(0);
                  btn.setMinimumWidth(0);
                  return btn;
              }

              private int dp(int value) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP,
                          value,
                          getResources().getDisplayMetrics()
                  );
              }

              private void requestLocationPermissionsIfNeeded() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                                  Manifest.permission.ACCESS_FINE_LOCATION,
                                  Manifest.permission.ACCESS_COARSE_LOCATION
                          }, 1001);
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
