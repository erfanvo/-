      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Snapp-License-Client-v1.1.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snapp-License-Client-APK
          path: Snapp-License-Client-v1.1.apk

      - name: Create GitHub Release (Optional Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: snapp-client-v1.1.${{ github.run_number }}
          name: "Snapp License Client APK (Build #${{ github.run_number }})"
          files: Snapp-License-Client-v1.1.apk
